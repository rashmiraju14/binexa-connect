# Local-only LibreTranslate service. Start Docker Desktop first.
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "127.0.0.1:5100:5000"
    environment:
      LT_LOAD_ONLY: en,zh,vi,es
      LT_BATCH_LIMIT: "80"
      LT_CHAR_LIMIT: "12000"
      LT_REQ_LIMIT: "60"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - binexa_translation_models:/home/libretranslate/.local
    restart: unless-stopped
volumes:
  binexa_translation_models:
